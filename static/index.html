<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Betta Judge · Evaluador IBC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% -10%, #0e0e2a 0%, #07071a 70%);
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    #root { min-height: 100vh; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1;   }
    }

    .fade-up { animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.32s; }
    .delay-5 { animation-delay: 0.40s; }
    .delay-6 { animation-delay: 0.48s; }
    .delay-7 { animation-delay: 0.56s; }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      backdrop-filter: blur(16px);
    }

    .upload-zone {
      border: 2px dashed rgba(255,255,255,0.10);
      border-radius: 18px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #818cf8;
      background: rgba(129,140,248,0.05);
    }

    .btn-primary {
      display: block; width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff; border: none; border-radius: 14px;
      padding: 15px 32px; font-family: 'DM Sans', sans-serif;
      font-size: 16px; font-weight: 600; letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99,102,241,0.45);
    }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-ghost {
      background: transparent; border: 1px solid rgba(255,255,255,0.10);
      color: #94a3b8; border-radius: 10px; padding: 9px 18px;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
    }
    .btn-ghost:hover { color: #e2e8f0; border-color: rgba(255,255,255,0.22); }

    .score-ring { transition: stroke-dashoffset 1.3s cubic-bezier(0.4, 0, 0.2, 1); }

    .bar-fill {
      height: 100%; border-radius: 100px;
      width: 0%;
      transition: width 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .param-row { opacity: 0; transform: translateY(12px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .param-row.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ── Config ─────────────────────────────────────────────── */
    const CAT = {
      'Campeón':          { color: '#FFD700', bg: 'rgba(255,215,0,0.13)',    label: '★ Campeón IBC' },
      'Show Quality':     { color: '#C084FC', bg: 'rgba(192,132,252,0.13)', label: '◆ Show Quality' },
      'Breeding Quality': { color: '#34D399', bg: 'rgba(52,211,153,0.13)',  label: '◉ Breeding Quality' },
      'Pet Quality':      { color: '#60A5FA', bg: 'rgba(96,165,250,0.13)',  label: '○ Pet Quality' },
      'No recomendado':   { color: '#6B7280', bg: 'rgba(107,114,128,0.13)', label: '✕ No Recomendado' },
    };

    const PARAMS = [
      { key: 'aletas',    label: 'Aletas',    icon: '🦋', color: '#60A5FA', weight: '25%' },
      { key: 'color',     label: 'Color',     icon: '🎨', color: '#F472B6', weight: '25%' },
      { key: 'postura',   label: 'Postura',   icon: '⚡', color: '#34D399', weight: '20%' },
      { key: 'morph',     label: 'Morph',     icon: '🔬', color: '#A78BFA', weight: '15%' },
      { key: 'condicion', label: 'Condición', icon: '❤️', color: '#FB923C', weight: '15%' },
    ];

    const REC = {
      'Apto reproductor':      { color: '#34D399', icon: '✓' },
      'Apto reventa premium':  { color: '#C084FC', icon: '★' },
      'Apto reventa estándar': { color: '#60A5FA', icon: '◆' },
      'Solo mascota':          { color: '#94a3b8', icon: '○' },
      'No recomendado':        { color: '#6B7280', icon: '✕' },
    };

    /* ── Image processing ───────────────────────────────────── */
    function resizeToJpeg(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Error leyendo el archivo'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('Imagen inválida o no soportada'));
          img.onload = () => {
            const MAX = 1024;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
              if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
              else        { w = Math.round(w * MAX / h); h = MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            resolve({ b64: dataUrl.split(',')[1], preview: dataUrl });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* ── SVG Score Circle ───────────────────────────────────── */
    function ScoreCircle({ score, color }) {
      const R = 54, CIRC = 2 * Math.PI * R;
      const [offset, setOffset] = useState(CIRC);
      useEffect(() => {
        const t = setTimeout(() => setOffset(CIRC * (1 - score / 10)), 250);
        return () => clearTimeout(t);
      }, [score]);

      return (
        <div style={{ position: 'relative', width: 164, height: 164, margin: '0 auto' }}>
          <svg width="164" height="164" viewBox="0 0 164 164">
            <circle cx="82" cy="82" r={R} fill="none"
              stroke="rgba(255,255,255,0.06)" strokeWidth="10" />
            <circle cx="82" cy="82" r={R} fill="none"
              stroke={color} strokeWidth="10" strokeLinecap="round"
              strokeDasharray={CIRC} strokeDashoffset={offset}
              transform="rotate(-90 82 82)" className="score-ring"
              style={{ filter: `drop-shadow(0 0 10px ${color}90)` }} />
          </svg>
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center',
          }}>
            <span style={{
              fontFamily: 'Playfair Display', fontSize: 38,
              fontWeight: 700, color, lineHeight: 1,
            }}>{score.toFixed(1)}</span>
            <span style={{ fontSize: 11, color: '#475569', marginTop: 5, letterSpacing: '0.12em', textTransform: 'uppercase' }}>
              score
            </span>
          </div>
        </div>
      );
    }

    /* ── Parameter Row ──────────────────────────────────────── */
    function ParamRow({ param, score, comment, delayMs }) {
      const barRef = useRef(null);
      const rowRef = useRef(null);

      useEffect(() => {
        const t1 = setTimeout(() => {
          if (rowRef.current) rowRef.current.classList.add('visible');
        }, delayMs);
        const t2 = setTimeout(() => {
          if (barRef.current) barRef.current.style.width = `${score * 10}%`;
        }, delayMs + 80);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, [score, delayMs]);

      return (
        <div ref={rowRef} className="param-row">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 17 }}>{param.icon}</span>
              <span style={{ fontSize: 14, fontWeight: 500 }}>{param.label}</span>
              <span style={{
                fontSize: 11, color: param.color,
                background: `${param.color}18`,
                padding: '2px 8px', borderRadius: 100,
              }}>{param.weight}</span>
            </div>
            <span style={{
              fontFamily: 'Playfair Display', fontSize: 19,
              fontWeight: 600, color: param.color,
            }}>{(score || 0).toFixed(1)}</span>
          </div>

          <div style={{
            height: 6, background: 'rgba(255,255,255,0.05)',
            borderRadius: 100, overflow: 'hidden', marginBottom: 10,
          }}>
            <div ref={barRef} className="bar-fill" style={{
              background: param.color,
              boxShadow: `0 0 8px ${param.color}70`,
            }} />
          </div>

          {comment && (
            <p style={{ fontSize: 13, color: '#94a3b8', lineHeight: 1.65, paddingLeft: 25 }}>
              {comment}
            </p>
          )}
        </div>
      );
    }

    /* ── Upload Zone ────────────────────────────────────────── */
    function UploadZone({ onFile }) {
      const [dragOver, setDragOver] = useState(false);
      const inputRef = useRef(null);

      const handleDrop = useCallback((e) => {
        e.preventDefault(); setDragOver(false);
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) onFile(file);
      }, [onFile]);

      return (
        <div
          className={`upload-zone ${dragOver ? 'drag-over' : ''}`}
          style={{ padding: '52px 24px', textAlign: 'center' }}
          onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={handleDrop}
          onClick={() => inputRef.current?.click()}
        >
          <input
            ref={inputRef} type="file" accept="image/*"
            style={{ display: 'none' }}
            onChange={(e) => { const f = e.target.files[0]; if (f) onFile(f); }}
          />
          <div style={{ fontSize: 52, marginBottom: 18, lineHeight: 1 }}>📸</div>
          <p style={{
            fontFamily: 'Playfair Display', fontSize: 20, fontWeight: 600, marginBottom: 8,
          }}>Sube la foto de tu betta</p>
          <p style={{ fontSize: 14, color: '#64748b', marginBottom: 6 }}>
            Arrastra aquí · toca para galería · cámara nativa en móvil
          </p>
          <p style={{ fontSize: 12, color: '#334155' }}>JPG · PNG · WEBP · HEIC</p>
        </div>
      );
    }

    /* ── Results Panel ──────────────────────────────────────── */
    function Results({ result, preview, onReset }) {
      const cat = CAT[result.categoria] || CAT['No recomendado'];
      const rec = REC[result.recomendacion] || REC['No recomendado'];

      return (
        <div style={{ maxWidth: 640, margin: '0 auto' }}>

          {/* ─ Hero card ─ */}
          <div className="card fade-up" style={{
            padding: '28px 24px', marginBottom: 14,
            borderColor: `${cat.color}28`,
            boxShadow: `0 0 50px ${cat.color}18, 0 0 100px ${cat.color}08`,
          }}>
            {/* Image + score row */}
            <div style={{ display: 'flex', gap: 24, alignItems: 'center', flexWrap: 'wrap', marginBottom: 22 }}>
              {preview && (
                <img src={preview} alt="Betta evaluado" style={{
                  width: 112, height: 112, objectFit: 'cover', borderRadius: 12, flexShrink: 0,
                  border: `2px solid ${cat.color}35`,
                }} />
              )}
              <div style={{ flex: 1, minWidth: 140 }}>
                <ScoreCircle score={result.nota_final} color={cat.color} />
              </div>
            </div>

            {/* Category badge */}
            <div style={{
              display: 'inline-flex', alignItems: 'center',
              padding: '6px 16px', borderRadius: 100,
              background: cat.bg, color: cat.color,
              fontWeight: 600, fontSize: 13, letterSpacing: '0.07em',
              marginBottom: 12,
            }}>
              {cat.label}
            </div>

            {/* Morph name */}
            <h2 style={{
              fontFamily: 'Playfair Display', fontSize: 'clamp(18px,4vw,23px)',
              fontWeight: 700, lineHeight: 1.3, marginBottom: 12,
            }}>
              {result.morph_identificado}
            </h2>

            {/* Recommendation */}
            <div style={{
              display: 'inline-flex', alignItems: 'center', gap: 7,
              padding: '5px 16px', borderRadius: 100,
              background: `${rec.color}18`, color: rec.color,
              fontSize: 13, fontWeight: 500,
            }}>
              <span>{rec.icon}</span>
              <span>{result.recomendacion}</span>
            </div>
          </div>

          {/* ─ Parameters ─ */}
          <div className="card fade-up delay-2" style={{ padding: '22px 24px', marginBottom: 14 }}>
            <p style={{
              fontSize: 11, fontWeight: 600, color: '#475569',
              letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 22,
            }}>Evaluación por parámetro</p>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
              {PARAMS.map((p, i) => (
                <ParamRow
                  key={p.key}
                  param={p}
                  score={result.scores?.[p.key] ?? 0}
                  comment={result.comentarios?.[p.key]}
                  delayMs={300 + i * 130}
                />
              ))}
            </div>
          </div>

          {/* ─ Summary ─ */}
          <div className="card fade-up delay-3" style={{ padding: '22px 24px', marginBottom: 20 }}>
            <p style={{
              fontSize: 11, fontWeight: 600, color: '#475569',
              letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 12,
            }}>Resumen técnico</p>
            <p style={{ fontSize: 15, lineHeight: 1.8, color: '#cbd5e1' }}>
              {result.resumen}
            </p>
          </div>

          {/* ─ Reset ─ */}
          <button className="btn-ghost fade-up delay-4" onClick={onReset}
            style={{ width: '100%', padding: '12px' }}>
            ← Evaluar otro betta
          </button>
        </div>
      );
    }

    /* ── App ────────────────────────────────────────────────── */
    function App() {
      const [preview, setPreview]   = useState(null);
      const [b64, setB64]           = useState(null);
      const [fileName, setFileName] = useState('');
      const [loading, setLoading]   = useState(false);
      const [result, setResult]     = useState(null);
      const [error, setError]       = useState(null);

      const handleFile = useCallback(async (file) => {
        setError(null); setResult(null);
        try {
          const { b64: data, preview: img } = await resizeToJpeg(file);
          setPreview(img); setB64(data); setFileName(file.name);
        } catch (e) {
          setError('No se pudo procesar la imagen. Intenta con otro archivo.');
        }
      }, []);

      const analyze = useCallback(async () => {
        if (!b64) return;
        setLoading(true); setError(null);
        try {
          const res = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ b64, mime: 'image/jpeg' }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
          setResult(data);
        } catch (e) {
          setError(e.message || 'Error de conexión. Verifica que el servidor esté corriendo.');
        } finally {
          setLoading(false);
        }
      }, [b64]);

      const reset = useCallback(() => {
        setPreview(null); setB64(null); setFileName('');
        setResult(null); setError(null);
      }, []);

      return (
        <div style={{ minHeight: '100vh', padding: '24px 16px 56px' }}>

          {/* ─ Header ─ */}
          <header style={{ textAlign: 'center', marginBottom: 36, paddingTop: 12 }}>
            <div style={{ fontSize: 44, marginBottom: 10 }}>🐟</div>
            <h1 style={{
              fontFamily: 'Playfair Display',
              fontSize: 'clamp(30px, 7vw, 46px)',
              fontWeight: 700,
              background: 'linear-gradient(135deg, #a78bfa 0%, #818cf8 50%, #60a5fa 100%)',
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
              marginBottom: 6,
            }}>Betta Judge</h1>
            <p style={{ fontSize: 13, color: '#475569', letterSpacing: '0.12em', textTransform: 'uppercase' }}>
              Evaluador Profesional · Estándar IBC
            </p>
          </header>

          {/* ─ Content ─ */}
          <div style={{ maxWidth: 640, margin: '0 auto' }}>

            {result ? (
              <Results result={result} preview={preview} onReset={reset} />
            ) : (
              <>
                {/* Upload or preview */}
                {!preview ? (
                  <div className="card fade-up" style={{ overflow: 'hidden', marginBottom: 16 }}>
                    <UploadZone onFile={handleFile} />
                  </div>
                ) : (
                  <div className="fade-up" style={{ marginBottom: 16 }}>
                    <div className="card" style={{ padding: 18, marginBottom: 12 }}>
                      <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
                        <img src={preview} alt="Preview"
                          style={{ width: 72, height: 72, objectFit: 'cover', borderRadius: 10, flexShrink: 0 }} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <p style={{ fontSize: 14, fontWeight: 500, marginBottom: 3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                            {fileName || 'imagen.jpg'}
                          </p>
                          <p style={{ fontSize: 12, color: '#64748b' }}>Listo para analizar</p>
                        </div>
                        <button className="btn-ghost" onClick={reset} style={{ padding: '8px 13px', flexShrink: 0 }}>✕</button>
                      </div>
                    </div>
                    <button className="btn-primary" onClick={analyze} disabled={loading}>
                      {loading ? 'Analizando...' : '🔬 Analizar con IA'}
                    </button>
                  </div>
                )}

                {/* Loading card */}
                {loading && (
                  <div className="card fade-up" style={{ padding: 40, textAlign: 'center', marginTop: 14 }}>
                    <div className="spinner" style={{ margin: '0 auto 22px' }} />
                    <p style={{
                      fontFamily: 'Playfair Display', fontSize: 19,
                      fontWeight: 600, marginBottom: 8,
                    }}>Analizando tu betta...</p>
                    <p style={{ fontSize: 13, color: '#64748b' }}>
                      Claude evalúa con criterio IBC profesional
                    </p>
                  </div>
                )}

                {/* Error */}
                {error && (
                  <div className="fade-up" style={{
                    marginTop: 14, padding: '14px 18px',
                    background: 'rgba(239,68,68,0.08)',
                    border: '1px solid rgba(239,68,68,0.25)',
                    borderRadius: 12, color: '#fca5a5', fontSize: 14, lineHeight: 1.6,
                  }}>
                    ⚠ {error}
                  </div>
                )}

                {/* IBC criteria grid — shown before upload */}
                {!preview && !loading && (
                  <div className="fade-up delay-2" style={{ marginTop: 18 }}>
                    <p style={{
                      fontSize: 11, color: '#334155', letterSpacing: '0.1em',
                      textTransform: 'uppercase', textAlign: 'center', marginBottom: 12,
                    }}>Parámetros evaluados</p>
                    <div style={{
                      display: 'grid',
                      gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))',
                      gap: 8,
                    }}>
                      {PARAMS.map(p => (
                        <div key={p.key} style={{
                          background: 'rgba(255,255,255,0.02)',
                          border: '1px solid rgba(255,255,255,0.05)',
                          borderRadius: 12, padding: '12px 14px',
                          display: 'flex', alignItems: 'center', gap: 10,
                        }}>
                          <span style={{ fontSize: 20 }}>{p.icon}</span>
                          <div>
                            <p style={{ fontSize: 13, fontWeight: 500 }}>{p.label}</p>
                            <p style={{ fontSize: 11, color: p.color, fontWeight: 500 }}>{p.weight}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
          </div>

          {/* ─ Footer ─ */}
          <footer style={{ textAlign: 'center', marginTop: 52, fontSize: 12, color: '#1e293b' }}>
            Betta Judge · Estándar IBC · Powered by Claude Vision
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
